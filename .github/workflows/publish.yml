{"name": "Publish Drone News", "on": {"schedule": [{"cron": "5 22 * * *"}, {"cron": "25 22 * * *"}], "push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write", "pages": "write", "id-token": "write"}, "concurrency": {"group": "pages", "cancel-in-progress": false}, "jobs": {"deploy": {"environment": {"name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}"}, "runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"name": "Sync from Google Drive", "run": "pip install -q gdown && echo  | base64 -d > sync.py && python3 sync.py && git config user.name github-actions && git config user.email actions@github.com && git add public/ && (git diff --staged --quiet || (git commit -m update && git push) || true)"}, {"uses": "actions/configure-pages@v5"}, {"uses": "actions/upload-pages-artifact@v3", "with": {"path": "./public"}}, {"id": "deployment", "uses": "actions/deploy-pages@v4"}]}}}
