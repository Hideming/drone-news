name: Publish Drone News

on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch from Google Drive and Build Site
        run: |
          pip install -q gdown
          python3 - << 'PY'
          import os, re, json, urllib.request, subprocess
          os.makedirs("/tmp/d", exist_ok=True)
          os.makedirs("site", exist_ok=True)
          ids = []
          for u in [
              "https://drive.google.com/file/d/1oA8QUGl_C7NGURVaMqPDSx2cmYHHPKba/view",
              "https://drive.google.com/embeddedfolderview?id=1YYCpL2ZTSuaGLKbqRY-pCRZrZuLgldr7#list"
          ]:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                  html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "ignore")
                  ids += re.findall(r"ID_([A-Za-z0-9_-]{20,})", html)
                  ids += re.findall(r'id="entry-([A-Za-z0-9_-]{20,})"', html)
              except Exception as e:
                  print("Fetch warn:", e)
          ids += ["1xUCtn_dwWys90PY2iR82NiQ70W2d_umh", "10bCD1iv6p2dgpW7lYdLX1GRXvz6D8ki_"]
          seen = []
          for fid in ids:
              if fid not in seen and fid != "1oA8QUGl_C7NGURVaMqPDSx2cmYHHPKba":
                  seen.append(fid)
          bundles = []
          for i, fid in enumerate(seen):
              out_p = f"/tmp/d/f_{i}.json"
              subprocess.run(["gdown", fid, "-O", out_p], check=False)
              if os.path.exists(out_p):
                  try:
                      d = json.load(open(out_p, encoding="utf-8"))
                      if "reader_html" in d and "operator_html" in d:
                          bundles.append(d)
                  except Exception as e:
                      print("Skip:", fid, e)
          bundles.sort(key=lambda x: str(x.get("date", "")))
          for d in bundles:
              open(f"site/{d.get('reader_filename','news.html')}", "w", encoding="utf-8").write(d["reader_html"])
              open(f"site/{d.get('operator_filename','operator_latest.html')}", "w", encoding="utf-8").write(d["operator_html"])
          if bundles:
              latest = bundles[-1]
              open("site/index.html", "w", encoding="utf-8").write(latest["reader_html"])
              open("site/operator.html", "w", encoding="utf-8").write(latest["operator_html"])
              print("Published latest date:", latest.get("date"))
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
